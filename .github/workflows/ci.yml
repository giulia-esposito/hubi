name: CI

# Runs on every push and pull request to develop and main. It needs no GCP
# credentials and deploys nothing: deployment is scripts/deploy.ts (see
# docs/deployment-runbook.md). The real Content Repository is gitignored, so
# the tests that need it skip themselves here; every synthetic and
# deterministic test still runs.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the production image (Dockerfile)
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The real-corpus tests need the confidential Content Repository, which is not in GitHub. They run in
      # `deploy.ts` (every deploy runs the full suite locally, corpus present). The skipped count is printed so a
      # growing number of skips is visible, not silent.
      - name: Tests (real-corpus tests skip: Content Repository is not in GitHub)
        shell: bash # with pipefail, so a failing test still fails the step despite the pipe
        run: npm test | tee test-output.txt
      - name: Report skipped tests
        run: grep -E "^ℹ (tests|pass|fail|skipped)" test-output.txt

      - name: Production build
        run: npm run build

      # Blocking: a high or critical advisory in a production dependency fails the build.
      # A moderate advisory with no upstream fix is tracked in docs/gcp-deployment-guide.md and does not.
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
